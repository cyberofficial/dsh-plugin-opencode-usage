# Profile patch layer shipped by dsh-plugin-opencode-usage itself: installing
# this package as a profile dependency (it declares `dsh.bundle`) appends this
# layer automatically, so the single row below is all it takes to mount both
# halves — the host half serves the usage numbers, and the browser half
# registers the composer-dock pill.
#
# The owner plugin name is the package name so the client module host pairs the
# row with this package's `dsh.client` browser bundle.
- insert:
    - id: plugin-opencode-usage
      name: dsh-plugin-opencode-usage
